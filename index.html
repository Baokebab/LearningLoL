    <div id="blazor-error-ui">

        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.958z1vx7fr.js" autostart="false"></script>
    <script>
        window.getScreenWidth = () => window.innerWidth;
        window.getScreenHeight = () => window.innerHeight;
        window.downloadFileFromStream = async (filename, contentStreamReference) => {
            const arrayBuffer = await contentStreamReference.arrayBuffer();
            const blob = new Blob([arrayBuffer], { type: "text/csv" });
            const url = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            a.click();

            URL.revokeObjectURL(url);
        };
    </script>

    <script src="brotliloader.min.js" type="module"></script>
